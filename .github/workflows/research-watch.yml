name: Daily research watch

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: research-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the published evidence model
        run: node scripts/validate-data.mjs
      - name: Check source health and current-event signals
        id: watch
        run: node scripts/research-watch.mjs
      - name: Upload the complete machine-readable report
        uses: actions/upload-artifact@v4
        with:
          name: research-watch-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
      - name: Refresh the editorial-review queue when evidence needs attention
        if: steps.watch.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Research watch: editorial review queue"
          issue_number="$(gh issue list --state open --search 'Research watch: editorial review queue in:title' --json number,title --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file artifacts/research-watch.md
          else
            gh issue create --title "$title" --body-file artifacts/research-watch.md
          fi
